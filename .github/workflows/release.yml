name: Release
on:
  workflow_dispatch:
    inputs:
      reaction_commit:
        description: 'Abbreviated commit hash for reaction'
        required: true
        type: string
      ioq3_commit:
        description: 'Abbreviated commit hash for ioquake3'
        required: true
        type: string
      version:
        description: 'Version number for Reaction'
        required: true
        type: string
        default: 'Beta 1.0'

permissions:
  contents: write

run-name: Release ${{ inputs.version }} (${{ inputs.reaction_commit }})

jobs:
  setup-release:
    name: Set up release
    runs-on: ubuntu-22.04
    steps:
    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        draft: true
        name: Reaction ${{ inputs.version }} (${{ inputs.reaction_commit }})
        tag_name: ${{ inputs.reaction_commit }}
        body: "ioquake3 commit: ${{ inputs.ioq3_commit }}"

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    needs: setup-release
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libsdl2-dev
    - name: Compile
      run: make release -j$(nproc)
      env:
        ARCHIVE: 1
    - uses: actions/upload-artifact@v7
      with:
        name: Linux
        path: build/*.zip
        if-no-files-found: error
        retention-days: 1
    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        draft: true
        tag_name: ${{ inputs.reaction_commit }}
        working_directory: build
        files: |
          *.zip

  windows:
    name: Windows
    runs-on: windows-2022
    needs: setup-release
    steps:
    - uses: actions/checkout@v6
    - name: Compile
      run: |
        choco install zip
        # HACK: This sets USE_CURL_DLOPEN=1 because Curl fails to link otherwise.
        make release -j $env:NUMBER_OF_PROCESSORS USE_CURL_DLOPEN=1
      env:
        ARCHIVE: 1
    - uses: actions/upload-artifact@v7
      with:
        name: Windows
        path: build/*.zip
        if-no-files-found: error
        retention-days: 1
    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        draft: true
        tag_name: ${{ inputs.reaction_commit }}
        working_directory: build
        files: |
          *.zip

  macos:
    name: macOS
    runs-on: macos-15
    needs: setup-release
    steps:
    - uses: actions/checkout@v6
    - name: Compile
      run: make release -j$(sysctl -n hw.logicalcpu)
      env:
        ARCHIVE: 1
    - uses: actions/upload-artifact@v7
      with:
        name: macOS
        path: build/*.zip
        if-no-files-found: error
        retention-days: 1
    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        draft: true
        tag_name: ${{ inputs.reaction_commit }}
        working_directory: build
        files: |
          *.zip   

  web:
    name: Web
    runs-on: ubuntu-latest
    needs: setup-release
    steps:
    - uses: actions/checkout@v6
    - uses: actions/checkout@v6
      with:
        repository: emscripten-core/emsdk
        path: emsdk
    - name: Install Dependencies
      run: |
        cd emsdk
        ./emsdk install 3.1.58
        ./emsdk activate 3.1.58
    - name: Compile
      env:
        ARCHIVE: 1
      run: |
        source emsdk/emsdk_env.sh
        emmake make release -j$(nproc)
    - uses: actions/upload-artifact@v7
      with:
        name: Web
        path: build/*.zip
        if-no-files-found: error
        retention-days: 1
    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        draft: true
        tag_name: ${{ inputs.reaction_commit }}
        working_directory: build
        files: |
          *.zip